services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diabete
      POSTGRES_PASSWORD: diabete
      POSTGRES_DB: diabete
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diabete"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://diabete:diabete@db:5432/diabete
      SECRET_KEY: ${SECRET_KEY:-cle-locale-de-developpement-32-caracteres-min}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata: